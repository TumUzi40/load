
<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบดูข้อมูลพักรถ</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #14532d;
      color: white;
      padding: 22px 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 16px 12px;
    }

    header h2 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 15px;
      background: #15803d;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .count, .panel {
      background: white;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .count {
      padding: 14px;
      font-size: 14px;
    }

    .panel { overflow: hidden; }

    .scroll {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 680px;
    }

    th, td {
      text-align: left;
      padding: 13px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #dcfce7;
      color: #14532d;
    }

    .plate {
      font-weight: bold;
      color: #166534;
    }

    #status {
      padding: 20px 12px;
      text-align: center;
      color: #64748b;
      white-space: pre-wrap;
    }

    #status.error {
      color: #b91c1c;
    }

    @media (max-width: 600px) {
      header h2 { font-size: 20px; }
      .toolbar { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <h2>🚚 ระบบดูข้อมูลพักรถ</h2>
      <p>ตรวจสอบทะเบียนรถ คนขับ จุดพัก และเวลาเข้า–ออก</p>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input id="search" type="search"
        placeholder="ค้นหาทะเบียนรถ ชื่อคนขับ หรือจุดพักรถ">
      <button id="refresh" onclick="loadData()">↻ รีเฟรช</button>
    </div>

    <div class="count" id="count">กำลังโหลดข้อมูล...</div>

    <section class="panel">
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>ทะเบียนรถ</th>
              <th>ชื่อคนขับ</th>
              <th>จุดพักรถ</th>
              <th>เวลาเข้า</th>
              <th>เวลาออก</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="status">กำลังเชื่อมต่อ Google Sheets...</div>
    </section>

    <div id="updated" style="font-size:12px;color:#64748b"></div>
  </main>

  <script>
    let dataRows = [];

    const search = document.getElementById('search');
    const tbody = document.getElementById('rows');
    const status = document.getElementById('status');
    const refresh = document.getElementById('refresh');

    function loadData() {
      refresh.disabled = true;
      status.className = '';
      status.hidden = false;
      status.textContent = 'กำลังโหลดข้อมูล...';

      google.script.run
        .withSuccessHandler(result => {
          dataRows = result.rows || [];
          renderRows();

          document.getElementById('updated').textContent =
            'อัปเดตล่าสุด: ' +
            new Date(result.updatedAt).toLocaleString('th-TH');

          refresh.disabled = false;
        })
        .withFailureHandler(error => {
          tbody.replaceChildren();
          status.hidden = false;
          status.className = 'error';
          status.textContent =
            'โหลดข้อมูลไม่สำเร็จ: ' +
            (error.message || 'เกิดข้อผิดพลาด');

          document.getElementById('count').textContent =
            'ไม่สามารถโหลดข้อมูลได้';

          refresh.disabled = false;
        })
        .getParkingData();
    }

    function addCell(tr, value, className) {
      const td = document.createElement('td');
      td.textContent = value || '-';
      if (className) td.className = className;
      tr.appendChild(td);
    }

    function renderRows() {
      const q = search.value.trim().toLowerCase();

      const filtered = dataRows.filter(row =>
        [
          row.plate, row.driver, row.location,
          row.timeIn, row.timeOut
        ].join(' ').toLowerCase().includes(q)
      );

      tbody.replaceChildren();

      filtered.forEach(row => {
        const tr = document.createElement('tr');

        addCell(tr, row.plate, 'plate');
        addCell(tr, row.driver);
        addCell(tr, row.location);
        addCell(tr, row.timeIn);
        addCell(tr, row.timeOut);

        tbody.appendChild(tr);
      });

      document.getElementById('count').textContent =
        'พบ ' + filtered.length + ' รายการ จากทั้งหมด ' +
        dataRows.length + ' รายการ';

      status.hidden = filtered.length > 0;

      if (!filtered.length) {
        status.className = '';
        status.textContent = dataRows.length
          ? 'ไม่พบข้อมูลที่ค้นหา'
          : 'ยังไม่มีข้อมูลพักรถ';
      }
    }

    search.addEventListener('input', renderRows);

    loadData();
  </script>
</body>
</html>
