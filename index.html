
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101014">
<title>SIAMLINK MOVIE | เว็บดูXหนังออนไลน์</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Tahoma, sans-serif;
  background: #101014;
  color: #fff;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(16,16,20,.96);
  padding: 16px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #ff3030;
  white-space: nowrap;
}

.search {
  background: #25252d;
  border: 1px solid #393943;
  color: white;
  padding: 11px 14px;
  border-radius: 8px;
  width: min(300px, 100%);
  outline: none;
}

.search:focus {
  border-color: #ff3030;
}

.hero {
  padding: 65px 6%;
  min-height: 280px;
  display: flex;
  align-items: center;
  background:
    linear-gradient(90deg, #101014 5%, rgba(16,16,20,.8) 55%, transparent),
    linear-gradient(0deg, #101014, transparent),
    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=80")
    center/cover;
}

.hero h1 {
  font-size: clamp(30px, 5vw, 48px);
  margin-bottom: 14px;
}

.hero p {
  color: #d1d1d1;
  max-width: 480px;
  line-height: 1.7;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 6px;
  padding: 11px 18px;
  font-weight: bold;
}

.play-btn {
  background: #ff3030;
  color: white;
  margin-top: 20px;
}

.play-btn:hover {
  background: #d82020;
}

main {
  padding: 10px 5% 45px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.toolbar h2 {
  font-size: 23px;
}

select {
  background: #25252d;
  color: white;
  border: 1px solid #393943;
  padding: 10px;
  border-radius: 6px;
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 20px 14px;
}

.movie {
  background: #1c1c23;
  border-radius: 9px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

.movie:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 25px #0008;
}

.poster {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
  background: #292932;
}

.movie-info {
  padding: 12px;
}

.movie-info h3 {
  font-size: 15px;
  margin-bottom: 8px;
  line-height: 1.4;
}

.movie-info p {
  color: #aaa;
  font-size: 12px;
}

.tag {
  display: inline-block;
  color: #ff6464;
  font-size: 12px;
  margin-top: 8px;
}

.empty {
  padding: 40px 0;
  color: #aaa;
  text-align: center;
  grid-column: 1 / -1;
}

footer {
  border-top: 1px solid #303038;
  padding: 25px;
  text-align: center;
  color: #999;
  font-size: 13px;
}

/* Video player modal */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,.94);
}

.modal.active {
  display: flex;
}

.player-box {
  width: min(950px, 100%);
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}

.player-header h2 {
  font-size: 18px;
}

.close-btn {
  background: #303038;
  color: white;
  font-size: 22px;
  padding: 5px 12px;
}

#videoPlayer {
  width: 100%;
  max-height: 72vh;
  background: #000;
  aspect-ratio: 16 / 9;
  display: block;
}

.player-note {
  color: #aaa;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 12px;
}

@media (max-width: 900px) {
  .movie-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  header {
    padding: 13px 4%;
  }

  .logo {
    font-size: 22px;
  }

  .search {
    width: 100%;
  }

  .hero {
    min-height: 240px;
    padding: 35px 5%;
  }

  main {
    padding: 10px 4% 35px;
  }

  .movie-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px 10px;
  }

  .movie-info {
    padding: 9px;
  }

  .movie-info h3 {
    font-size: 14px;
  }

  .modal {
    padding: 10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SIAM MOVIE</div>
  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="ค้นหาหนัง..."
    aria-label="ค้นหาหนัง"
  >
</header>

<section class="hero">
  <div>
    <h1>โลกแห่งความบันเทิง</h1>
    <p>ค้นพบภาพยนตร์เรื่องโปรดของคุณ
       เลือกหนังและรับชมได้ในหน้าเดียว</p>
    <button class="play-btn" id="featuredBtn">
      ▶ ดูตัวอย่าง
    </button>
  </div>
</section>

<main>
  <div class="toolbar">
    <h2>🎬 หนังทั้งหมด</h2>

    <select id="categoryFilter" aria-label="เลือกหมวดหมู่">
      <option value="ทั้งหมด">ทุกหมวดหมู่</option>
      <option value="แอ็กชัน">แอ็กชัน</option>
      <option value="ผจญภัย">ผจญภัย</option>
      <option value="ดราม่า">ดราม่า</option>
      <option value="แอนิเมชัน">แอนิเมชัน</option>
    </select>
  </div>

  <div id="movieGrid" class="movie-grid"></div>
</main>

<footer>
  SIAM MOVIE — เว็บไซต์ตัวอย่างสำหรับรับชมวิดีโอ
</footer>

<!-- หน้าต่างเล่นวิดีโอ -->
<div
  id="playerModal"
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-label="เครื่องเล่นวิดีโอ"
>
  <div class="player-box">
    <div class="player-header">
      <h2 id="playerTitle">กำลังเล่นวิดีโอ</h2>
      <button class="close-btn" id="closePlayer"
        aria-label="ปิดเครื่องเล่น">×</button>
    </div>

    <video id="videoPlayer" controls playsinline
      preload="metadata">
      เบราว์เซอร์ของคุณไม่รองรับวิดีโอ HTML5
    </video>

    <p class="player-note">
      หากวิดีโอเล่นไม่ได้ ให้ตรวจสอบ URL และรูปแบบไฟล์
      วิดีโอโดยตรงควรเป็นไฟล์ที่เบราว์เซอร์รองรับ เช่น MP4
    </p>
  </div>
</div>

<script>
const movies = [
  {
    id: 1,
    title: "ตัวอย่างหนังแอ็กชัน",
    category: "แอ็กชัน",
    year: 2025,
    poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  },
  {
    id: 2,
    title: "การผจญภัยครั้งใหม่",
    category: "ผจญภัย",
    year: 2025,
    poster: "https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
  },
  {
    id: 3,
    title: "เรื่องราวแห่งความฝัน",
    category: "ดราม่า",
    year: 2024,
    poster: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
  },
  {
    id: 4,
    title: "โลกแห่งแอนิเมชัน",
    category: "แอนิเมชัน",
    year: 2025,
    poster: "https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
  },
  {
    id: 5,
    title: "ภารกิจสุดระทึก",
    category: "แอ็กชัน",
    year: 2024,
    poster: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"
  },
  {
    id: 6,
    title: "เดินทางสู่โลกกว้าง",
    category: "ผจญภัย",
    year: 2023,
    poster: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
  },
  {
    id: 7,
    title: "คืนแห่งความทรงจำ",
    category: "ดราม่า",
    year: 2024,
    poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
  },
  {
    id: 8,
    title: "เพื่อนรักผจญภัย",
    category: "แอนิเมชัน",
    year: 2025,
    poster: "https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=500&q=80",
    video: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  }
];

const grid = document.getElementById("movieGrid");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const modal = document.getElementById("playerModal");
const videoPlayer = document.getElementById("videoPlayer");
const playerTitle = document.getElementById("playerTitle");

function renderMovies() {
  const keyword = searchInput.value.trim().toLowerCase();
  const category = categoryFilter.value;

  const filtered = movies.filter(movie => {
    const matchesName = movie.title.toLowerCase()
      .includes(keyword);
    const matchesCategory = category === "ทั้งหมด" ||
      movie.category === category;

    return matchesName && matchesCategory;
  });

  grid.replaceChildren();

  if (filtered.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "ไม่พบหนังที่คุณค้นหา";
    grid.appendChild(empty);
    return;
  }

  filtered.forEach(movie => {
    const card = document.createElement("article");
    card.className = "movie";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", "ดู " + movie.title);

    const poster = document.createElement("img");
    poster.className = "poster";
    poster.src = movie.poster;
    poster.alt = movie.title;
    poster.loading = "lazy";

    const info = document.createElement("div");
    info.className = "movie-info";

    const title = document.createElement("h3");
    title.textContent = movie.title;

    const details = document.createElement("p");
    details.textContent = movie.year + " • " + movie.category;

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "▶ รับชมตัวอย่าง";

    info.append(title, details, tag);
    card.append(poster, info);

    card.addEventListener("click", () => playMovie(movie));
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        playMovie(movie);
      }
    });

    grid.appendChild(card);
  });
}

function playMovie(movie) {
  videoPlayer.pause();
  videoPlayer.src = movie.video;
  playerTitle.textContent = movie.title;
  modal.classList.add("active");
  document.body.style.overflow = "hidden";
  videoPlayer.load();

  const result = videoPlayer.play();
  if (result && result.catch) {
    result.catch(() => {
      // ผู้ใช้สามารถกดปุ่มเล่นบนเครื่องเล่นได้
    });
  }
}

function closePlayer() {
  videoPlayer.pause();
  videoPlayer.removeAttribute("src");
  videoPlayer.load();
  modal.classList.remove("active");
  document.body.style.overflow = "";
}

searchInput.addEventListener("input", renderMovies);
categoryFilter.addEventListener("change", renderMovies);
document.getElementById("closePlayer")
  .addEventListener("click", closePlayer);

document.getElementById("featuredBtn")
  .addEventListener("click", () => playMovie(movies[0]));

modal.addEventListener("click", event => {
  if (event.target === modal) closePlayer();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && modal.classList.contains("active")) {
    closePlayer();
  }
});

renderMovies();
</script>

</body>
</html>
