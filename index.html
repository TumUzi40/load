
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NON Video Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .player {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px #0008;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #222;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #e50914;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #b20710;
    }

    input[type="range"] {
      accent-color: #e50914;
      cursor: pointer;
    }

    #progress {
      flex: 1;
      min-width: 100px;
    }

    #volume {
      width: 80px;
    }

    .time {
      font-size: 13px;
      color: #ddd;
    }

    .file-input {
      margin-top: 18px;
      padding: 12px;
      width: 100%;
      background: #222;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>NON VIDEO PLAYER</h2>

  <div class="player">
    <video id="video" playsinline>
      <source src="video.mp4" type="video/mp4">
      non
    </video>

    <div class="controls">
      <button id="playBtn">▶ เล่น</button>

      <span class="time" id="current">00:00</span>

      <input type="range" id="progress"
             min="0" max="100" value="0"
             aria-label="ตำแหน่งวิดีโอ">

      <span class="time" id="duration">00:00</span>

      <button id="muteBtn">🔊</button>

      <input type="range" id="volume"
             min="0" max="1" step="0.1"
             value="1" aria-label="ระดับเสียง">

      <button id="fullBtn">⛶ เต็มจอ</button>
    </div>
  </div>

  <input class="file-input" type="file"
         id="fileInput" accept="video/*">

</div>

<script>
  const video = document.getElementById("video");
  const playBtn = document.getElementById("playBtn");
  const progress = document.getElementById("progress");
  const current = document.getElementById("current");
  const duration = document.getElementById("duration");
  const volume = document.getElementById("volume");
  const muteBtn = document.getElementById("muteBtn");

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "00:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return String(m).padStart(2, "0") + ":" +
           String(s).padStart(2, "0");
  }

  playBtn.onclick = async () => {
    if (video.paused) {
      try {
        await video.play();
      } catch (error) {
        console.log("ไม่สามารถเล่นวิดีโอได้", error);
      }
    } else {
      video.pause();
    }
  };

  video.onplay = () => playBtn.textContent = "⏸ หยุดชั่วคราว";
  video.onpause = () => playBtn.textContent = "▶ เล่น";

  video.ontimeupdate = () => {
    if (video.duration) {
      progress.value =
        (video.currentTime / video.duration) * 100;
      current.textContent = formatTime(video.currentTime);
    }
  };

  video.onloadedmetadata = () => {
    duration.textContent = formatTime(video.duration);
  };

  progress.oninput = () => {
    if (video.duration) {
      video.currentTime =
        (progress.value / 100) * video.duration;
    }
  };

  volume.oninput = () => {
    video.volume = Number(volume.value);
    video.muted = false;
    muteBtn.textContent = video.volume === 0 ? "🔇" : "🔊";
  };

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? "🔇" : "🔊";
  };

  document.getElementById("fullBtn").onclick = () => {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  };

  document.getElementById("fileInput").onchange = (event) => {
    const file = event.target.files[0];
    if (file) {
      video.src = URL.createObjectURL(file);
      video.load();
      video.play().catch(() => {});
    }
  };
</script>

</body>
    </html>
